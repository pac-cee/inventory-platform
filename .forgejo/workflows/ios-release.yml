name: ios-release

# Tagged iOS release of the INVENTORY app: build, sign and upload to TestFlight
# via mobile/ios/fastlane/Fastfile. Push a tag named  ios-v<version>  (for
# example ios-v0.1.1) on a commit that is on main.
#
# Adapted from ego-mobile's ios-release.yml; that pipeline reached TestFlight by
# hand on 2026-09-04. THIS file is untested until its first tag — see
# Crucial_Docs/INVENTORY-RELEASE-AND-CI-PLAN.md (Part C) for what must exist
# first (the match provisioning profile for co.verlet.inventory, the secrets).
#
# runs-on: macos — a HOST runner on the Mac mini (act_runner `:host` label), the
# only kind that can run Xcode. Steps run on the Mac's own filesystem, so this
# VERIFIES the toolchain instead of installing it.
#
# Remember the Forgejo quirks: this repo is a pull MIRROR of GitHub (sync it
# first), the workflow file must exist on the tagged commit, and use a fresh tag
# name for every attempt.

on:
  push:
    tags:
      - "ios-v*"

concurrency:
  # A TestFlight upload in flight should finish or fail on its own, not be
  # killed by a second tag push.
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag fires no matter which branch its commit is on. Releases must come
      # from main only — refuse anything else before spending ten minutes on an
      # archive or, worse, uploading it.
      - name: Verify this tag's commit is reachable from main
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "OK: $GITHUB_REF_NAME is reachable from main"
          else
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main — refusing to release. Merge to main first, then tag." >&2
            exit 1
          fi

      - name: Verify the toolchain this runner is supposed to already have
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          pod --version
          fastlane --version
          flutter --version

      # The version shown to testers comes from the tag (ios-v0.1.1 -> 0.1.1);
      # the build number comes from TestFlight (latest + 1) inside the Fastfile.
      - name: Work out the version from the tag
        id: ver
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#ios-v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Tag '$GITHUB_REF_NAME' must look like ios-v0.1.1" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # mobile/.env is gitignored but is a declared asset: without it the build
      # stops with "asset not found". The Fastfile also does this; doing it here
      # means `pod install` and `flutter pub get` already see a complete tree.
      - name: Create the bundled .env from the example
        working-directory: mobile
        run: |
          set -euo pipefail
          [ -f .env ] || cp .env.example .env

      # Must run before `pod install`: the Podfile needs ios/Flutter/Generated.xcconfig.
      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: pod install --repo-update

      # `flutter build ipa` calls xcodebuild directly (not through fastlane), so
      # the CI keychain must already be unlocked at the OS level.
      #
      # Which keychain: the repo variable IOS_KEYCHAIN_NAME, default
      # fastlane_ci.keychain-db (the one ego-mobile's pipeline uses). Give the
      # inventory app its OWN keychain (set IOS_KEYCHAIN_NAME, e.g.
      # fastlane_inventory.keychain-db) when its password differs from ego's, so
      # nothing here can lock ego's pipeline out. A keychain that does not exist yet
      # is created with the secret's password: match imports the certificates into
      # it from the encrypted certificates repo on the first run.
      - name: Unlock (or create) the signing keychain
        env:
          KEYCHAIN_NAME: ${{ vars.IOS_KEYCHAIN_NAME || 'fastlane_ci.keychain-db' }}
          KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYCHAIN_PASSWORD}" ]; then
            echo "::error::The MATCH_KEYCHAIN_PASSWORD secret is empty or missing for this repo." >&2
            exit 1
          fi
          if [ ! -e "$HOME/Library/Keychains/${KEYCHAIN_NAME}" ]; then
            echo "Keychain ${KEYCHAIN_NAME} does not exist on this runner; creating it."
            security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
            # Stay unlocked for 6 hours, longer than any build here.
            security set-keychain-settings -lut 21600 "${KEYCHAIN_NAME}"
            existing="$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
            # shellcheck disable=SC2086
            security list-keychains -d user -s "${KEYCHAIN_NAME}" ${existing}
          fi
          if ! security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"; then
            echo "::error::The keychain ${KEYCHAIN_NAME} exists on this runner, but the MATCH_KEYCHAIN_PASSWORD secret does not unlock it. Either set the secret to that keychain's real password, or point this repo at a fresh keychain: set the repo variable IOS_KEYCHAIN_NAME to a new name (for example fastlane_inventory.keychain-db) and re-run; it will be created with the secret's password. Do NOT change ego-mobile's keychain password for this." >&2
            exit 1
          fi
          echo "Keychain ${KEYCHAIN_NAME} is unlocked."

      - name: Fastlane release (build, sign, upload to TestFlight)
        working-directory: mobile/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_NAME: ${{ vars.IOS_KEYCHAIN_NAME || 'fastlane_ci.keychain-db' }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          # "true" (default): match only READS profiles. Set the repo variable
          # IOS_MATCH_READONLY to "false" for ONE run to let it create the missing
          # profile for co.verlet.inventory, then set it back.
          MATCH_READONLY: ${{ vars.IOS_MATCH_READONLY || 'true' }}
          # Production API unless the repo variable API_URL says otherwise.
          API_URL: ${{ vars.API_URL }}
          IOS_VERSION: ${{ steps.ver.outputs.version }}
        run: fastlane release
